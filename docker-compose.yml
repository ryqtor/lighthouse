version: '3.8'

services:
  lighthouse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lighthouse-chat
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./saved_chats:/app/saved_chats
      - ./data:/app/data
    environment:
      - LIGHTHOUSE_IP=0.0.0.0
      - LIGHTHOUSE_PORT=8080
    restart: unless-stopped
    networks:
      - lighthouse-net

  llama-server:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: llama-server
    ports:
      - "8081:8080"
    volumes:
      - ./models:/models
    command: >
      -m /models/model.gguf
      --host 0.0.0.0
      --port 8080
    restart: unless-stopped
    networks:
      - lighthouse-net

networks:
  lighthouse-net:
    driver: bridge
